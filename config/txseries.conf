# Programs translated by the CICS translator of IBM TXSeries
# (cicstran / cicstcl with -lCOBCLD or -lCOBOLIT), as compiled by
# COBOL-IT / CobolCloud, for the language method of txseries/:
#
#   CICS_COBCLD_CCFLAGS="-std=txseries" cicstcl -lCOBCLD prog.ccp
#
# The translator passes the binary items of the program to TXSeries
# through native (COMP-5) temporary items, converted with MOVE, so the
# representation of COMP / BINARY items is free; it is kept big-endian
# (as COBOL-IT, Micro Focus and the mainframe) for the data shared in
# raw form (TS / TD queues, files, COMMAREA).

include "default.conf"

name: "IBM TXSeries CICS (COBOL-IT)"

# the translator writes SPECIAL-NAMES (CALL-CONVENTION 8 IS LITLINK)
# directly in the ENVIRONMENT DIVISION, without CONFIGURATION SECTION
missing-conf-section:		ok

# cicstcl compiles with -fnotrunc: no truncation of binary items to
# their PICTURE, and DISPLAY of binary items with all the digits of
# their storage (as -fnotrunc does)
binary-truncate:		no
pretty-display:			no
